included:
  - MoyeoTrip
  - MoyeoTripTests
  - MoyeoTripUITests

strict: true

excluded:
  - .build
  - DerivedData
  - MoyeoTrip.xcodeproj

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 80
  error: 120

cyclomatic_complexity:
  warning: 10
  error: 20

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 45
    error: 60
  excluded:
    - id
    - x
    - y

type_name:
  min_length:
    warning: 3
  max_length:
    warning: 50
    error: 60

reporter: xcode
